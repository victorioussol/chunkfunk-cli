name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run fixtures:up
      - run: npm run fixtures:seed
        env:
          FIXTURES_PG_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      - run: npm test
        env:
          FIXTURES_PG_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      - if: always()
        run: npm run fixtures:down
